<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>시계 연습</title>
<style>
  :root{
    --bg:#f5f3ec; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --hour:#e0393e; --minute:#2563eb;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* ---------- 상단 바 ---------- */
  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:8px;flex:1;justify-content:center}
  .tab{font:inherit;font-size:clamp(16px,2.1vw,24px);font-weight:800;padding:10px 26px;border-radius:999px;
    border:2px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .tools{display:flex;gap:8px;align-items:center}
  .chip{font:inherit;font-size:clamp(13px,1.5vw,17px);font-weight:700;padding:8px 14px;border-radius:12px;
    border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip.on{background:#eef2ff;border-color:var(--minute);color:var(--minute)}
  .legend{display:flex;gap:14px;font-weight:700;font-size:clamp(13px,1.5vw,17px);white-space:nowrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;height:8px;border-radius:4px}
  .legend .lh i{width:22px;background:var(--hour)}
  .legend .lm i{width:36px;background:var(--minute)}

  /* ---------- 페이지 ---------- */
  main{flex:1;min-height:0;display:flex}
  .page{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;padding:10px 16px 14px;gap:10px}
  .page.active{display:flex}
  .clockwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .clockwrap svg{width:100%;height:100%;display:block}

  .pair{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
  .col{display:flex;flex-direction:column;align-items:center;min-height:0;gap:6px}
  .col h2{margin:0;font-size:clamp(18px,2.4vw,28px);font-weight:800}
  .col.start h2{color:#0f766e}
  .col.end h2{color:#9333ea}
  .arrow{align-self:center;font-size:clamp(28px,4vw,56px);color:var(--muted);font-weight:900}

  /* ---------- 답 칸 ---------- */
  .answer{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
    font-size:clamp(22px,3vw,38px);font-weight:800}
  .answer label{white-space:nowrap}
  input.num{font:inherit;font-weight:800;width:2.6em;text-align:center;padding:4px 0;border-radius:14px;
    border:3px solid #cbd5e1;background:#fff;color:var(--ink);outline:none;
    -moz-appearance:textfield;appearance:textfield}
  input.num::-webkit-outer-spin-button,input.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input.num:focus{border-color:var(--minute);box-shadow:0 0 0 4px #bfdbfe}
  input.num.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  input.num.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}

  .bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;width:100%}
  .elapsed{background:#fff;border:2px solid var(--line);border-radius:20px;padding:8px 20px}
  .btn{font:inherit;font-size:clamp(17px,2.2vw,26px);font-weight:800;padding:10px 26px;border-radius:16px;border:none;cursor:pointer}
  .btn.check{background:var(--ink);color:#fff}
  .btn.next{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .msg{min-width:8em;text-align:center;font-size:clamp(18px,2.4vw,30px);font-weight:900}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

  .streak{font-size:clamp(16px,2vw,24px);font-weight:900;color:#b45309;background:#fef3c7;border-radius:999px;padding:6px 16px;white-space:nowrap}

  /* 기록창 */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:28px;padding:28px 36px;width:min(560px,100%);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal-box h3{margin:0 0 6px;font-size:clamp(20px,2.6vw,30px);color:var(--muted)}
  .big{font-size:clamp(48px,7vw,84px);font-weight:900;color:#b45309;line-height:1.1}
  .best{font-size:clamp(16px,2vw,22px);font-weight:800;color:var(--muted);margin-bottom:18px}
  .ans{border-top:2px dashed var(--line);padding-top:16px;margin-bottom:20px;font-size:clamp(18px,2.4vw,28px);font-weight:800;line-height:1.7}
  .ans .k{color:var(--muted);margin-right:8px}
  .ans .right{color:var(--ok)}
  .ans .mine{color:var(--bad)}

  .row-bottom{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}

  /* 세로 화면(좁을 때) 두 시계 위아래 대신 작은 화살표 유지 */
  .tab{white-space:nowrap}
  .tab.free.active{background:#0f766e;border-color:#0f766e}
  header{flex-wrap:wrap}
  .tabs{flex-wrap:wrap}
  @media (max-width:1500px){
    .legend{display:none}
    .tab{padding:10px 16px}
  }

  /* 자유 조작 시계 */
  svg.free{touch-action:none;cursor:grab}
  svg.free:active{cursor:grabbing}
  .hint{margin:0;font-size:clamp(14px,1.8vw,20px);color:var(--muted);font-weight:700}
  .readout{background:#fff;border:3px solid var(--line);border-radius:16px;padding:4px 22px;min-width:6.5em;
    text-align:center;font-size:clamp(22px,3vw,38px);font-weight:900;color:var(--ink)}
  .readout.hidden{color:#cbd5e1}
  .readout.elapsed-out{border-color:#9333ea;color:#7e22ce}
  .readout.elapsed-out.hidden{border-color:var(--line);color:#cbd5e1}
  /* 세로 화면: 두 시계를 위아래로 */
  @media (orientation:portrait){
    .pair{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:14px}
    .arrow{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="legend"><span class="lh"><i></i>시침(짧은 바늘)</span><span class="lm"><i></i>분침(긴 바늘)</span></div>
  <nav class="tabs">
    <button class="tab active" data-page="p1">① 시각 읽기 문제</button>
    <button class="tab" data-page="p2">② 걸린 시간 문제</button>
    <button class="tab free" data-page="f1">③ 시각 만들기</button>
    <button class="tab free" data-page="f2">④ 걸린 시간 만들기</button>
  </nav>
  <div class="tools">
    <button class="chip" id="levelBtn" title="걸린 시간 문제 난이도" style="display:none">난이도: 보통</button>
    <button class="chip on" id="minNumBtn" title="바깥쪽 분 숫자 보이기">분 숫자</button>
    <button class="chip" id="fsBtn" title="전체화면">⛶ 전체화면</button>
  </div>
</header>

<main>
  <!-- ① 시각 읽기 -->
  <section class="page active" id="p1">
    <div class="clockwrap"><svg id="clock1"></svg></div>
    <div class="answer">
      <label><input class="num" id="a1h" type="number" inputmode="numeric" min="1" max="12"> 시</label>
      <label><input class="num" id="a1m" type="number" inputmode="numeric" min="0" max="59"> 분</label>
    </div>
    <div class="row-bottom">
      <button class="btn check" id="check1">확인하기</button>
      <button class="btn next" id="next1">다음 문제 ▶</button>
      <div class="msg" id="msg1"></div>
      <div class="streak" id="st1">연속 정답 0</div>
    </div>
  </section>

  <!-- ② 걸린 시간 -->
  <section class="page" id="p2">
    <div class="pair">
      <div class="col start">
        <h2>처음 시각</h2>
        <div class="clockwrap"><svg id="clockS"></svg></div>
        <div class="answer">
          <label><input class="num" id="sH" type="number" inputmode="numeric"> 시</label>
          <label><input class="num" id="sM" type="number" inputmode="numeric"> 분</label>
        </div>
      </div>
      <div class="arrow">➜</div>
      <div class="col end">
        <h2>나중 시각</h2>
        <div class="clockwrap"><svg id="clockE"></svg></div>
        <div class="answer">
          <label><input class="num" id="eH" type="number" inputmode="numeric"> 시</label>
          <label><input class="num" id="eM" type="number" inputmode="numeric"> 분</label>
        </div>
      </div>
    </div>
    <div class="bar">
      <div class="answer elapsed">
        <span>걸린 시간</span>
        <label><input class="num" id="dH" type="number" inputmode="numeric"> 시간</label>
        <label><input class="num" id="dM" type="number" inputmode="numeric"> 분</label>
      </div>
      <button class="btn check" id="check2">확인하기</button>
      <button class="btn next" id="next2">다음 문제 ▶</button>
      <div class="msg" id="msg2"></div>
      <div class="streak" id="st2">연속 정답 0</div>
    </div>
  </section>

  <!-- ③ 시각 만들기 (자유) -->
  <section class="page" id="f1">
    <p class="hint">시계를 손가락으로 돌리면 분침이 움직여요. 시침은 저절로 따라가요.</p>
    <div class="clockwrap"><svg id="clockF"></svg></div>
    <div class="row-bottom">
      <div class="readout" id="rF"></div>
      <button class="btn next" id="resetF">12시로</button>
    </div>
  </section>

  <!-- ④ 걸린 시간 만들기 (자유) -->
  <section class="page" id="f2">
    <p class="hint">두 시계의 분침을 돌려 처음 시각과 나중 시각을 만들고, 걸린 시간을 써 보세요.</p>
    <div class="pair">
      <div class="col start">
        <h2>처음 시각</h2>
        <div class="clockwrap"><svg id="clockFS"></svg></div>
        <div class="readout" id="rFS"></div>
      </div>
      <div class="arrow">➜</div>
      <div class="col end">
        <h2>나중 시각</h2>
        <div class="clockwrap"><svg id="clockFE"></svg></div>
        <div class="readout" id="rFE"></div>
      </div>
    </div>
    <div class="bar">
      <div class="answer elapsed">
        <span>걸린 시간</span>
        <label><input class="num" id="fdH" type="number" inputmode="numeric"> 시간</label>
        <label><input class="num" id="fdM" type="number" inputmode="numeric"> 분</label>
      </div>
      <button class="btn check" id="checkF2">확인하기</button>
      <button class="btn next" id="showF2">정답 보기</button>
      <button class="btn next" id="resetF2">처음으로</button>
      <div class="msg" id="msgF2"></div>
      <div class="readout elapsed-out" id="rFD" style="display:none"></div>
    </div>
  </section>
</main>

<!-- 틀렸을 때 기록창 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>연속으로 맞힌 문제</h3>
    <div class="big" id="mCount">0문제</div>
    <div class="best" id="mBest">최고 기록 0문제</div>
    <div class="ans" id="mAns"></div>
    <button class="btn check" id="mNext">새 문제 풀기 ▶</button>
  </div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

/* ---------- 시계 그리기 ---------- */
const R = 185;
function buildClock(svg){
  svg.setAttribute("viewBox", "-225 -225 450 450");
  // 바깥 분 숫자
  const minNums = el("g", {class:"minnums"}, svg);
  for (let i = 0; i < 12; i++){
    const a = i * 30 * Math.PI / 180, r = 207;
    el("text", {x: r*Math.sin(a), y: -r*Math.cos(a), "text-anchor":"middle", "dominant-baseline":"central",
      "font-size":17, "font-weight":700, fill:"#2563eb"}, minNums, i*5);
  }
  // 시계판
  el("circle", {r:R+6, fill:"#334155"}, svg);
  el("circle", {r:R, fill:"#fff"}, svg);
  // 눈금
  for (let i = 0; i < 60; i++){
    const big = i % 5 === 0;
    const a = i * 6 * Math.PI / 180, r1 = R - 3, r2 = big ? R - 28 : R - 15;
    el("line", {x1: r1*Math.sin(a), y1: -r1*Math.cos(a), x2: r2*Math.sin(a), y2: -r2*Math.cos(a),
      stroke:"#1f2937", "stroke-width": big ? 6 : 2.5, "stroke-linecap":"round"}, svg);
  }
  // 시 숫자
  for (let h = 1; h <= 12; h++){
    const a = h * 30 * Math.PI / 180, r = 132;
    el("text", {x: r*Math.sin(a), y: -r*Math.cos(a), "text-anchor":"middle", "dominant-baseline":"central",
      "font-size":40.5, "font-weight":800, fill:"#111827"}, svg, h);
  }
  // 시침: 짧은 빨간 바늘 (굵기는 분침과 같음)
  const hour = el("g", {}, svg);
  el("path", {d:"M -6 22 L -6 -76 L 0 -100 L 6 -76 L 6 22 Z", fill:"#e0393e", stroke:"#9f1d22", "stroke-width":2, "stroke-linejoin":"round"}, hour);
  // 분침: 길고 가는 파란 바늘
  const minute = el("g", {}, svg);
  el("path", {d:"M -6 28 L -6 -138 L 0 -165 L 6 -138 L 6 28 Z", fill:"#2563eb", stroke:"#1e3a8a", "stroke-width":2, "stroke-linejoin":"round"}, minute);
  el("circle", {r:14, fill:"#1f2937"}, svg);
  el("circle", {r:5, fill:"#fff"}, svg);
  svg._hour = hour; svg._minute = minute;
}
function setClock(svg, h, m){
  svg._hour.setAttribute("transform", `rotate(${(h % 12) * 30 + m * 0.5})`);
  svg._minute.setAttribute("transform", `rotate(${m * 6})`);
}

const clock1 = $("clock1"), clockS = $("clockS"), clockE = $("clockE");
[clock1, clockS, clockE].forEach(buildClock);

/* ---------- 설정 ---------- */
const step = 1;   // 분침 조작은 1분 단위
const rand = n => Math.floor(Math.random() * n);
// ① 문제: 1분 단위 60%, 5분 단위 40%
const pickStep = () => Math.random() < 0.6 ? 1 : 5;
$("minNumBtn").onclick = () => {
  const on = $("minNumBtn").classList.toggle("on");
  document.querySelectorAll(".minnums").forEach(g => g.style.display = on ? "" : "none");
};

/* ---------- 탭 전환 ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === t.dataset.page));
  $("levelBtn").style.display = t.dataset.page === "p2" ? "" : "none";   // 난이도는 ②번에서만
});

/* ---------- ② 난이도: 보통(5·10분 단위 반반) / 쉬움(10분 단위만) ---------- */
let level = "보통";
$("levelBtn").onclick = () => {
  level = level === "보통" ? "쉬움" : "보통";
  $("levelBtn").textContent = `난이도: ${level}`;
  $("levelBtn").classList.toggle("on", level === "쉬움");
  newP2();
};

/* ---------- 공통 ---------- */
const val = inp => inp.value.trim() === "" ? null : Number(inp.value);
function mark(inputs, ok){ inputs.forEach(i => { i.classList.remove("ok","bad"); i.classList.add(ok ? "ok" : "bad"); }); }
function clear(ids, msgId){
  ids.forEach(id => { $(id).value = ""; $(id).classList.remove("ok","bad"); });
  $(msgId).textContent = ""; $(msgId).className = "msg";
}
function showMsg(id, ok){
  $(id).textContent = ok ? "정답이에요! 👏" : "다시 해 볼까요?";
  $(id).className = "msg " + (ok ? "ok" : "bad");
}
document.querySelectorAll("input.num").forEach(i => {
  i.addEventListener("input", () => {
    if (i.value.length > 2) i.value = i.value.slice(0, 2);
    i.classList.remove("ok","bad");
  });
  i.addEventListener("keydown", e => {
    if (e.key === "Enter") (i.closest("#p1") ? check1 : i.closest("#f2") ? checkF2 : check2)();
  });
});

/* ---------- 연속 정답 기록 ---------- */
const rec = {1: {streak: 0, best: 0}, 2: {streak: 0, best: 0}};
let modalNext = null;
function updStreak(n){ $("st" + n).textContent = `연속 정답 ${rec[n].streak}`; }
function onRight(n){
  rec[n].streak++; rec[n].best = Math.max(rec[n].best, rec[n].streak); updStreak(n);
}
function onWrong(n, ansHtml, next){
  $("mCount").textContent = `${rec[n].streak}문제`;
  $("mBest").textContent = `최고 기록 ${rec[n].best}문제`;
  $("mAns").innerHTML = ansHtml;
  rec[n].streak = 0; updStreak(n);
  modalNext = next;
  $("modal").classList.add("show");
}
$("mNext").onclick = () => { $("modal").classList.remove("show"); if (modalNext) modalNext(); };
const shown = v => v === null ? "□" : v;
function emptyMsg(id){ $(id).textContent = "빈칸을 채워요"; $(id).className = "msg bad"; }

/* ---------- ① 시각 읽기 ---------- */
let p1 = {h:0, m:0};
function newP1(){
  const s = pickStep();
  p1 = {h: rand(12) + 1, m: rand(60 / s) * s};
  setClock(clock1, p1.h, p1.m);
  clear(["a1h","a1m"], "msg1");
}
function check1(){
  if (p1.done) return;
  const h = val($("a1h")), m = val($("a1m"));
  if (h === null || m === null) return emptyMsg("msg1");
  const okH = h === p1.h, okM = m === p1.m;
  mark([$("a1h")], okH); mark([$("a1m")], okM);
  showMsg("msg1", okH && okM);
  p1.done = true;   // 한 문제는 한 번만 채점
  if (okH && okM) onRight(1);
  else onWrong(1,
    `<div><span class="k">정답</span><span class="right">${p1.h}시 ${p1.m}분</span></div>
     <div><span class="k">내가 쓴 답</span><span class="mine">${h}시 ${m}분</span></div>`, newP1);
}
$("check1").onclick = check1;
$("next1").onclick = newP1;

/* ---------- ② 걸린 시간 ---------- */
let p2 = {};
function newP2(){
  // 보통: 10분 단위 50%, 5분 단위 50% / 쉬움: 10분 단위만
  const s = level === "쉬움" || Math.random() < 0.5 ? 10 : 5;
  const sh = rand(12) + 1;
  let sm, dur;
  do {
    sm = rand(60 / s) * s;
    dur = (rand(180 / s) + 1) * s;                    // 최대 3시간
  } while (s === 5 && sm % 10 === 0 && dur % 10 === 0); // 5분 단위 문제엔 5분이 꼭 들어가게
  const tot = (sh % 12) * 60 + sm + dur;
  let eh = Math.floor(tot / 60) % 12; if (eh === 0) eh = 12;
  const em = tot % 60;
  p2 = {sh, sm, eh, em, dur};
  setClock(clockS, sh, sm); setClock(clockE, eh, em);
  clear(["sH","sM","eH","eM","dH","dM"], "msg2");
}
function check2(){
  if (p2.done) return;
  const v = ["sH","sM","eH","eM","dH","dM"].map(id => val($(id)));
  if (v.slice(0, 4).includes(null) || (v[4] === null && v[5] === null)) return emptyMsg("msg2");
  const r = [
    [$("sH"), val($("sH")) === p2.sh], [$("sM"), val($("sM")) === p2.sm],
    [$("eH"), val($("eH")) === p2.eh], [$("eM"), val($("eM")) === p2.em],
  ];
  r.forEach(([i, ok]) => mark([i], ok));
  // 걸린 시간: "1시간 20분" 또는 "80분" 모두 정답
  const dh = val($("dH")), dm = val($("dM"));
  let okD = false;
  if (dh !== null || dm !== null){
    const H = dh || 0, M = dm || 0;
    okD = H * 60 + M === p2.dur && (H === 0 || M < 60);
  }
  mark([$("dH"), $("dM")], okD);
  const allOk = okD && r.every(x => x[1]);
  showMsg("msg2", allOk);
  p2.done = true;   // 한 문제는 한 번만 채점
  if (allOk) onRight(2);
  else {
    const row = (k, right, mine, ok) =>
      `<div><span class="k">${k}</span><span class="right">${right}</span>` +
      (ok ? "" : `<div class="mine" style="font-size:.8em;line-height:1.3;margin-bottom:6px">내가 쓴 답: ${mine}</div>`) + `</div>`;
    const myDur = (v[4] !== null ? `${v[4]}시간 ` : "") + (v[5] !== null ? `${v[5]}분` : "");
    onWrong(2,
      row("처음 시각", `${p2.sh}시 ${p2.sm}분`, `${v[0]}시 ${v[1]}분`, r[0][1] && r[1][1]) +
      row("나중 시각", `${p2.eh}시 ${p2.em}분`, `${v[2]}시 ${v[3]}분`, r[2][1] && r[3][1]) +
      row("걸린 시간", fmtDur(p2.dur), myDur, okD), newP2);
  }
}
$("check2").onclick = check2;
$("next2").onclick = newP2;

newP1(); newP2();

/* ---------- ③④ 자유롭게 분침 돌리기 ---------- */
// svg._total = 12시부터 지난 분(0~719). 분침을 돌리면 시침이 자동으로 따라감.
function makeFree(svg, onChange){
  svg.classList.add("free");
  svg._total = 0;
  const apply = () => { setClock(svg, Math.floor(svg._total / 60), svg._total % 60); onChange(); };
  const minuteAt = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let a = Math.atan2(p.x, -p.y) * 180 / Math.PI; if (a < 0) a += 360;
    return (Math.round(a / 6 / step) * step) % 60;
  };
  const move = e => {
    let d = minuteAt(e) - svg._total % 60;
    if (d > 30) d -= 60; if (d < -30) d += 60;   // 12를 지나가면 시가 바뀜
    if (!d) return;
    svg._total = ((svg._total + d) % 720 + 720) % 720;
    apply();
  };
  let drag = false;
  svg.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener("pointermove", e => { if (drag) move(e); });
  svg.addEventListener("pointerup", () => drag = false);
  svg.addEventListener("pointercancel", () => drag = false);
  svg._set = t => { svg._total = t; apply(); };
}
const fmt = t => `${Math.floor(t / 60) || 12}시 ${t % 60}분`;
function fmtDur(d){
  const h = Math.floor(d / 60), m = d % 60;
  if (!h) return `${m}분`;
  return (m ? `${h}시간 ${m}분` : `${h}시간`) + ` (${d}분)`;
}
function setReadout(id, shown, text, hiddenText){
  $(id).textContent = shown ? text : hiddenText;
  $(id).classList.toggle("hidden", !shown);
}

// ③ 시각 만들기
const clockF = $("clockF"); buildClock(clockF);
const updF = () => $("rF").textContent = fmt(clockF._total);
makeFree(clockF, updF); clockF._set(0);
$("resetF").onclick = () => clockF._set(0);

// ④ 걸린 시간 만들기
const clockFS = $("clockFS"), clockFE = $("clockFE");
buildClock(clockFS); buildClock(clockFE);
let showF2 = false;
const updF2 = () => {
  $("rFS").textContent = fmt(clockFS._total);
  $("rFE").textContent = fmt(clockFE._total);
  $("rFD").textContent = fmtDur(durF2());
  $("rFD").style.display = showF2 ? "" : "none";
};
const durF2 = () => (clockFE._total - clockFS._total + 720) % 720;
// 분침을 다시 돌리면 채점 표시를 지움
const onMoveF2 = () => {
  ["fdH","fdM"].forEach(id => $(id).classList.remove("ok","bad"));
  $("msgF2").textContent = ""; $("msgF2").className = "msg";
  updF2();
};
makeFree(clockFS, onMoveF2); makeFree(clockFE, onMoveF2);
function checkF2(){
  // "1시간 20분" 또는 "80분" 모두 정답
  const dh = val($("fdH")), dm = val($("fdM"));
  let ok = false;
  if (dh !== null || dm !== null){
    const H = dh || 0, M = dm || 0;
    ok = H * 60 + M === durF2() && (H === 0 || M < 60);
  }
  mark([$("fdH"), $("fdM")], ok);
  showMsg("msgF2", ok);
}
$("checkF2").onclick = checkF2;
$("showF2").onclick = () => { showF2 = !showF2; $("showF2").textContent = showF2 ? "정답 숨기기" : "정답 보기"; updF2(); };
$("resetF2").onclick = () => { clear(["fdH","fdM"], "msgF2"); clockFS._set(60); clockFE._set(60); };
clockFS._set(60); clockFE._set(60);
document.querySelectorAll(".minnums").forEach(g => g.style.display = $("minNumBtn").classList.contains("on") ? "" : "none");

/* ---------- 전체화면 ---------- */
const docEl = document.documentElement;
const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
function enterFs(){
  const f = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
  if (f) try { const p = f.call(docEl); if (p && p.catch) p.catch(() => {}); } catch(e){}
}
function exitFs(){
  const f = document.exitFullscreen || document.webkitExitFullscreen;
  if (f) f.call(document);
}
$("fsBtn").onclick = e => { e.stopPropagation(); isFs() ? exitFs() : enterFs(); };
// 기본값: 처음 화면을 터치하면 바로 전체화면 (브라우저 정책상 터치가 한 번 필요함)
let autoFsDone = false;
document.addEventListener("pointerdown", () => {
  if (autoFsDone) return; autoFsDone = true;
  if (!isFs()) enterFs();
}, true);
enterFs(); // 앱/키오스크 모드 등에서 허용되면 즉시 전체화면
</script>
